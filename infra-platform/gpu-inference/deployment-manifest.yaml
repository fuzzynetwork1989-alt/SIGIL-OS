# NEXORA Omega GPU Inference Deployment Manifest
# Kubernetes-style deployment configuration for GPU inference

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-model-server
  namespace: nexora-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexora-model-server
  template:
    metadata:
      labels:
        app: nexora-model-server
    spec:
      containers:
      - name: vllm-server
        image: nexora-omega/vllm-server:latest
        resources:
          limits:
            nvidia.com/gpu: 4
            memory: "64Gi"
            cpu: "16"
          requests:
            nvidia.com/gpu: 4
            memory: "32Gi"
            cpu: "8"
        env:
        - name: MODEL_NAME
          value: "Qwen/Qwen3-30B-A3B-Instruct-2507"
        - name: TENSOR_PARALLEL_SIZE
          value: "4"
        - name: MAX_MODEL_LEN
          value: "262144"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.9"
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: nexora-secrets
              key: vllm-api-key
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: metrics
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-model-server
  namespace: nexora-production
spec:
  selector:
    app: nexora-model-server
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: metrics
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-model-server-hpa
  namespace: nexora-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexora-model-server
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80