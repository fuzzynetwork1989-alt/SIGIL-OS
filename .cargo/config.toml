# Cargo configuration to prevent lock issues

[target.x86_64-pc-windows-gnu]
# MinGW-w64 GCC from MSYS2 (ucrt64). Required because MSVC build tools are
# not installed and Git's link.exe shadows the MSVC linker.
linker = "C:/msys64/ucrt64/bin/gcc.exe"

[build]
# Parallel jobs; cargo handles its own locking. Raised from 1 to speed up
# cold-cache rebuilds after the target/ directory was cleaned.
jobs = 4

[net]
# Retry on network failures
retry = 3
git-fetch-with-cli = true

[http]
# Timeouts
timeout = 30

[registry]
default = "sparse+https://index.crates.io/"

[source.crates-io]
registry = "sparse+https://index.crates.io/"
