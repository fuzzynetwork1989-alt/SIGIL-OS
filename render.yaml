services:
  - type: web
    name: sigil-os-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      - key: SIGIL_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true
    branch: main
