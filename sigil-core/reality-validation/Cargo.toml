[package]
name = "reality-validation"
version = "0.1.0"
edition = "2021"
authors = ["SIGIL OS Team"]
description = "Reality Validation Intelligence - Pillar 08 of SCA-1R Cognitive Architecture"

[dependencies]
sigil = { path = "../sigil" }
memory = { path = "../memory" }
world-model = { path = "../world-model" }
errors = { path = "../errors" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
log = "0.4"
thiserror = "1.0"
