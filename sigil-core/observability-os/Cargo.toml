[package]
name = "observability-os"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = { version = "0.23", features = ["trace"] }
prometheus = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"
