<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient)" />

  <!-- Sigil symbol - stylized "S" with cryptographic elements -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="white" stroke-width="8" opacity="0.3" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="white" stroke-width="4" opacity="0.5" />

    <!-- Inner cryptographic pattern -->
    <g fill="white" opacity="0.8">
      <!-- Center dot -->
      <circle cx="0" cy="0" r="20" />

      <!-- Orbiting dots -->
      <circle cx="0" cy="-120" r="8" />
      <circle cx="104" cy="60" r="8" />
      <circle cx="-104" cy="60" r="8" />
    </g>

    <!-- Stylized S -->
    <path d="M -60 -40 Q 0 -80 60 -40 Q 80 -20 60 0 Q 40 20 0 40 Q -40 60 -60 80 Q -80 100 -40 120 Q 0 140 60 120 Q 80 100 60 80"
          fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Connection lines -->
    <g stroke="white" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-20" x2="0" y2="-120" />
      <line x1="17" y1="10" x2="104" y2="60" />
      <line x1="-17" y1="10" x2="-104" y2="60" />
    </g>
  </g>

  <!-- Text label -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">SIGIL OS</text>
</svg>
