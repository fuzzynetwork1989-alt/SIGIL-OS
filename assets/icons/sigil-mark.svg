<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep violet -> magenta brand gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#4C1D95"/>
      <stop offset="75%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <!-- Luminous mark gradient -->
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>
    <radialGradient id="irisFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D0FE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F5D0FE" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed square background (stores apply their own mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Faint constellation field -->
  <g fill="#FFFFFF" opacity="0.14">
    <circle cx="140" cy="180" r="4"/>
    <circle cx="220" cy="120" r="3"/>
    <circle cx="330" cy="200" r="3"/>
    <circle cx="120" cy="330" r="3"/>
    <circle cx="880" cy="160" r="4"/>
    <circle cx="940" cy="260" r="3"/>
    <circle cx="840" cy="380" r="3"/>
    <circle cx="950" cy="640" r="4"/>
    <circle cx="860" cy="780" r="3"/>
    <circle cx="120" cy="700" r="4"/>
    <circle cx="200" cy="860" r="3"/>
    <circle cx="330" cy="880" r="3"/>
  </g>

  <!-- Outer seal ring -->
  <circle cx="512" cy="512" r="438" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.16"/>

  <!-- SIGIL mark -->
  <g transform="translate(512,512)" filter="url(#glow)">
    <!-- Eye / sigil outline (almond seal) -->
    <path d="M -290 0 C -150 -140 150 -140 290 0 C 150 140 -150 140 -290 0 Z"
          fill="none" stroke="url(#mark)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Iris -->
    <circle r="122" fill="url(#irisFill)" stroke="url(#mark)" stroke-width="20"/>

    <!-- Iris nodes (segmented cognition ring) -->
    <g fill="url(#mark)">
      <circle cx="0" cy="-122" r="17"/>
      <circle cx="106" cy="-61" r="17"/>
      <circle cx="106" cy="61" r="17"/>
      <circle cx="0" cy="122" r="17"/>
      <circle cx="-106" cy="61" r="17"/>
      <circle cx="-106" cy="-61" r="17"/>
    </g>

    <!-- Pupil -->
    <circle r="38" fill="url(#mark)"/>
    <circle r="38" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Sparkle accents -->
  <g fill="#FBCFE8" opacity="0.9">
    <path transform="translate(196,196) scale(1.5)" d="M0 -18 L4.5 -4.5 L18 0 L4.5 4.5 L0 18 L-4.5 4.5 L-18 0 L-4.5 -4.5 Z"/>
    <path transform="translate(836,836) scale(1.1)" d="M0 -18 L4.5 -4.5 L18 0 L4.5 4.5 L0 18 L-4.5 4.5 L-18 0 L-4.5 -4.5 Z"/>
  </g>
</svg>
