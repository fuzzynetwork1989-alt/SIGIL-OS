<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A202C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sigilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3182CE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D53F8C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rectangle -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180" ry="180"/>

  <!-- SIGIL Symbol - Geometric Brain/Neural Network -->
  <g transform="translate(512, 512)" filter="url(#glow)">
    <!-- Outer Octagon -->
    <polygon points="0,-280 200,-200 280,0 200,200 0,280 -200,200 -280,0 -200,-200"
             fill="none" stroke="url(#sigilGradient)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner Neural Network Lines -->
    <g stroke="url(#sigilGradient)" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <!-- Center node to outer nodes -->
      <line x1="0" y1="0" x2="0" y2="-180"/>
      <line x1="0" y1="0" x2="127" y2="-127"/>
      <line x1="0" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="0" x2="127" y2="127"/>
      <line x1="0" y1="0" x2="0" y2="180"/>
      <line x1="0" y1="0" x2="-127" y2="127"/>
      <line x1="0" y1="0" x2="-180" y2="0"/>
      <line x1="0" y1="0" x2="-127" y2="-127"/>

      <!-- Outer ring connections -->
      <line x1="0" y1="-180" x2="127" y2="-127"/>
      <line x1="127" y1="-127" x2="180" y2="0"/>
      <line x1="180" y1="0" x2="127" y2="127"/>
      <line x1="127" y1="127" x2="0" y2="180"/>
      <line x1="0" y1="180" x2="-127" y2="127"/>
      <line x1="-127" y1="127" x2="-180" y2="0"/>
      <line x1="-180" y1="0" x2="-127" y2="-127"/>
      <line x1="-127" y1="-127" x2="0" y2="-180"/>
    </g>

    <!-- Center Node -->
    <circle cx="0" cy="0" r="40" fill="url(#sigilGradient)"/>

    <!-- Outer Nodes -->
    <g fill="url(#sigilGradient)">
      <circle cx="0" cy="-180" r="20"/>
      <circle cx="127" cy="-127" r="20"/>
      <circle cx="180" cy="0" r="20"/>
      <circle cx="127" cy="127" r="20"/>
      <circle cx="0" cy="180" r="20"/>
      <circle cx="-127" cy="127" r="20"/>
      <circle cx="-180" cy="0" r="20"/>
      <circle cx="-127" cy="-127" r="20"/>
    </g>

    <!-- Inner Brain Pattern -->
    <g stroke="#D53F8C" stroke-width="2" fill="none" opacity="0.5">
      <path d="M-60,-80 Q0,-120 60,-80 Q100,-40 80,20 Q60,80 0,100 Q-60,80 -80,20 Q-100,-40 -60,-80"/>
      <path d="M-40,-60 Q0,-90 40,-60 Q70,-30 60,10 Q40,50 0,70 Q-40,50 -60,10 Q-70,-30 -40,-60"/>
      <path d="M-20,-40 Q0,-60 20,-40 Q40,-20 35,5 Q20,30 0,40 Q-20,30 -35,5 Q-40,-20 -20,-40"/>
    </g>
  </g>

  <!-- SIGIL OS Text -->
  <text x="512" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#E2E8F0">
    SIGIL OS
  </text>
</svg>
