<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIL OS - AI Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            color: #ececf1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #44475a;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #565f89;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
        }

        .header .logo {
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header button {
            background: #7aa2f7;
            color: #1f2335;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .header button:hover {
            background: #89b4fa;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .message.user {
            background: #7aa2f7;
            color: #1f2335;
            align-self: flex-end;
            max-width: 70%;
        }

        .message.ai {
            background: #44475a;
            color: #ececf1;
            align-self: flex-start;
            max-width: 70%;
        }

        .input-area {
            padding: 20px;
            background: #44475a;
            border-top: 1px solid #565f89;
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 1px solid #565f89;
            border-radius: 8px;
            background: #1f2335;
            color: #ececf1;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #7aa2f7;
        }

        button.send-btn {
            padding: 15px 30px;
            background: #7aa2f7;
            color: #1f2335;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button.send-btn:hover {
            background: #89b4fa;
        }

        button.send-btn:disabled {
            background: #565f89;
            cursor: not-allowed;
        }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: #1f2335;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            border: 1px solid #565f89;
        }

        .settings-content h2 {
            margin-bottom: 20px;
            color: #ececf1;
        }

        .settings-content label {
            display: block;
            margin-bottom: 5px;
            color: #9aa5ce;
        }

        .settings-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #565f89;
            border-radius: 6px;
            background: #24283b;
            color: #ececf1;
            font-size: 14px;
        }

        .settings-content input:focus {
            outline: none;
            border-color: #7aa2f7;
        }

        .settings-content button {
            margin-right: 10px;
            padding: 10px 20px;
        }

        .status {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
        }

        .status.success {
            background: #73daca;
            color: #1f2335;
        }

        .status.error {
            background: #f7768e;
            color: #1f2335;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #7aa2f7 0%, #bb9af7 100%);
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .welcome-banner h2 {
            margin-bottom: 10px;
        }

        .welcome-banner p {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🧠 SIGIL OS</div>
        <div class="header-buttons">
            <button onclick="openSettings()">⚙️ Settings</button>
        </div>
    </div>

    <div class="chat-container" id="chat-container">
        <div class="welcome-banner">
            <h2>Welcome to SIGIL OS!</h2>
            <p>Your AI companion for everyday use. Configure your API key in settings to get started.</p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="send-button" onclick="sendMessage()">Send</button>
    </div>

    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <h2>⚙️ Settings</h2>
            <div id="status"></div>
            <label for="api-key">OpenAI API Key:</label>
            <input type="password" id="api-key" placeholder="sk-...">
            <label for="model-select">Model:</label>
            <select id="model-select" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #565f89; border-radius: 6px; background: #24283b; color: #ececf1;">
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            </select>
            <button onclick="saveSettings()">Save</button>
            <button onclick="closeSettings()">Cancel</button>
        </div>
    </div>

    <script>
        // Simple cloud-based chat app (like ChatGPT web)
        // No server needed - uses cloud API directly from browser

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message) return;

            const apiKey = localStorage.getItem('sigil_api_key');
            if (!apiKey) {
                addMessage('Please configure your API key in settings first (⚙️ Settings)', 'ai');
                openSettings();
                return;
            }

            addMessage(message, 'user');
            input.value = '';

            const sendButton = document.getElementById('send-button');
            sendButton.disabled = true;

            try {
                const model = localStorage.getItem('sigil_model') || 'gpt-4';
                
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: 'You are SIGIL OS, a helpful AI assistant for everyday users. Be friendly, clear, and concise.' },
                            { role: 'user', content: message }
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiMessage = data.choices[0].message.content;
                addMessage(aiMessage, 'ai');
            } catch (error) {
                addMessage('❌ Error: ' + error.message, 'ai');
            }

            sendButton.disabled = false;
        }

        function addMessage(text, type) {
            const container = document.getElementById('chat-container');
            
            // Remove welcome banner on first message
            const welcomeBanner = container.querySelector('.welcome-banner');
            if (welcomeBanner) {
                welcomeBanner.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + type;
            messageDiv.innerHTML = `<p>${text}</p>`;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
            
            const apiKey = localStorage.getItem('sigil_api_key');
            if (apiKey) {
                document.getElementById('api-key').value = apiKey;
            }

            const model = localStorage.getItem('sigil_model') || 'gpt-4';
            document.getElementById('model-select').value = model;
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function saveSettings() {
            const apiKey = document.getElementById('api-key').value.trim();
            const model = document.getElementById('model-select').value;
            const status = document.getElementById('status');
            
            if (!apiKey) {
                status.className = 'status error';
                status.textContent = '❌ API key is required';
                return;
            }

            localStorage.setItem('sigil_api_key', apiKey);
            localStorage.setItem('sigil_model', model);
            
            status.className = 'status success';
            status.textContent = '✅ Settings saved!';
            
            setTimeout(() => {
                closeSettings();
                status.textContent = '';
            }, 1000);
        }
    </script>
</body>
</html>
