[workspace]
members = [
    "sigil-core/sigil",
    "sigil-core/persistence",
    "sigil-core/api",
    "model-fabric",
    "ui-ux",
    "dream-weaving",
    "quest-integration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIGIL OS Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ed25519-dalek = "2.0"
rand = "0.8"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# HTTP
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
hex = "0.4"

# Testing
proptest = "1.4"
tempfile = "3.8"
