# SIGIL OS

[workspace]
resolver = "2"
members = [
    "sigil-core/sigil",
    "sigil-core/persistence",
    "sigil-core/api",
    "sigil-core/memory",
    "sigil-core/retrieval",
    "sigil-core/context",
    "sigil-core/world-model",
    "sigil-core/tools",
    "sigil-core/recovery",
    "sigil-core/evaluation-os",
    "sigil-core/runtime-orchestration",
    "sigil-core/observability-os",
    "sigil-core/architecture-genome",
    "sigil-core/economic-engine",
    "sigil-core/agent-ecosystem",
    "sigil-core/testing-framework",
    "model-fabric",
    "ui-ux",
    "dream-weaving",
    "quest-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIGIL OS Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json"] }
ed25519-dalek = "2.0"
rand = "0.8"
chrono = "0.4"
hex = "0.4"
proptest = "1.0"
rusqlite = "0.30"
tempfile = "3.8"
clap = { version = "4.4", features = ["derive"] }
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
candle-core = "0.11"
opentelemetry = { version = "0.23", features = ["trace"] }
prometheus = "0.13"
