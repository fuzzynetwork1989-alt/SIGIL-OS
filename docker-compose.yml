version: '3.8'

services:
  # Cognitive Kernel Service
  cognitive-kernel:
    build:
      context: ./sigil-core
      dockerfile: Dockerfile
    container_name: sigil-cognitive-kernel
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - VECTOR_DB_URL=http://qdrant:6333
      - GRAPH_DB_URL=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://sigil:sigil_password@postgres:5432/sigil_db
      - VERIFICATION_MESH_ENABLED=true
      - DREAM_LEARNING_ENABLED=false
    volumes:
      - ./sigil-core:/app
      - sigil-logs:/var/log/sigil
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
    networks:
      - sigil-network
    restart: unless-stopped

  # Web Console
  web-console:
    build:
      context: ./web-console
      dockerfile: Dockerfile
    container_name: sigil-web-console
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=production
    depends_on:
      - cognitive-kernel
    networks:
      - sigil-network
    restart: unless-stopped

  # PostgreSQL for relational data
  postgres:
    image: postgres:16-alpine
    container_name: sigil-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sigil
      - POSTGRES_PASSWORD=sigil_password
      - POSTGRES_DB=sigil_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d
    networks:
      - sigil-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j for causal graph
  neo4j:
    image: neo4j:5.15-community
    container_name: sigil-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sigil_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - sigil-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant for vector memory
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sigil-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - sigil-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and events
  redis:
    image: redis:7-alpine
    container_name: sigil-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - sigil-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS for event bus
  nats:
    image: nats:2.10-alpine
    container_name: sigil-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: >
      -js
      -m 8222
      --store_dir /data/nats
    volumes:
      - nats-data:/data/nats
    networks:
      - sigil-network
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sigil-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sigil-network
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: sigil-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sigil_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - sigil-network
    restart: unless-stopped

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: sigil-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - sigil-network
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
  sigil-logs:

networks:
  sigil-network:
    driver: bridge
