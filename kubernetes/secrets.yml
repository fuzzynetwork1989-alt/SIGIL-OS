apiVersion: v1
kind: Secret
metadata:
  name: sigil-secrets
  namespace: sigil-production
type: Opaque
stringData:
  # PostgreSQL
  postgres-user: "sigil"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  postgres-url: "postgresql://sigil:CHANGE_ME_IN_PRODUCTION@postgres:5432/sigil_db"
  
  # Neo4j
  neo4j-auth: "neo4j/CHANGE_ME_IN_PRODUCTION"
  
  # Redis
  redis-password: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT Secrets
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  jwt-issuer: "sigil-os"
  
  # API Keys (if using external services)
  openai-api-key: ""
  anthropic-api-key: ""
  
  # Encryption Keys
  encryption-key: "CHANGE_ME_IN_PRODUCTION_32_BYTES"
  
  # Monitoring
  prometheus-remote-write-url: ""
  prometheus-remote-write-auth: ""
  
  # Cloud Storage (S3-compatible)
  s3-access-key: ""
  s3-secret-key: ""
  s3-bucket: ""
  s3-endpoint: ""
  
  # Federation Secrets
  federation-shared-secret: "CHANGE_ME_IN_PRODUCTION"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: sigil-tls
  namespace: sigil-production
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0XTApUHJvdmlkZSB5b3VyIFRMUyBjZXJ0aWZpY2F0ZSBoZXJlCg==
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCgpQcm92aWRlIHlvdXIgUFJJVkFURSBrZXkgaGVyZQo=
