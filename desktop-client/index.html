<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGIL - Your AI Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #7c3aed 50%, #0f172a 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .message-user {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    }
    .message-assistant {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // State
    let messages = [
      {
        id: '1',
        role: 'assistant',
        content: "Hi! I'm SIGIL, your AI companion. I remember our conversations and I'm here to help you with anything. What's on your mind today?",
        timestamp: new Date()
      }
    ];
    let input = '';

    // Greeting based on time
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Good morning';
      if (hour < 18) return 'Good afternoon';
      return 'Good evening';
    }

    // Render app
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <!-- Header -->
          <div class="glass px-6 py-4">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                  <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <h1 class="text-white font-bold">SIGIL</h1>
                  <p class="text-purple-300 text-sm">Your AI companion</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-purple-300 transition-colors">
                  <i data-lucide="heart" class="w-5 h-5"></i>
                </button>
                <button class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-purple-300 transition-colors">
                  <i data-lucide="clock" class="w-5 h-5"></i>
                </button>
                <button class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-purple-300 transition-colors">
                  <i data-lucide="more-vertical" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Messages -->
          <div class="flex-1 overflow-y-auto px-6 py-8">
            <div class="max-w-4xl mx-auto space-y-6">
              ${messages.map(msg => `
                <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[70%] rounded-2xl p-4 ${
                    msg.role === 'user' ? 'message-user text-white' : 'message-assistant text-white'
                  }">
                    <p class="text-sm leading-relaxed">${msg.content}</p>
                    <p class="text-xs mt-2 ${msg.role === 'user' ? 'text-purple-200' : 'text-purple-300'}">
                      ${msg.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                    </p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Input -->
          <div class="glass px-6 py-4">
            <div class="max-w-4xl mx-auto">
              <div class="flex items-end gap-3">
                <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 text-purple-300 transition-colors">
                  <i data-lucide="paperclip" class="w-5 h-5"></i>
                </button>
                <div class="flex-1 glass rounded-2xl">
                  <textarea
                    id="messageInput"
                    placeholder="Type your message..."
                    class="w-full bg-transparent text-white placeholder-purple-300 resize-none focus:outline-none p-4 min-h-[60px]"
                    rows="1"
                  ></textarea>
                </div>
                <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 text-purple-300 transition-colors">
                  <i data-lucide="smile" class="w-5 h-5"></i>
                </button>
                <button
                  id="sendBtn"
                  class="p-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90 transition-all"
                >
                  <i data-lucide="send" class="w-5 h-5"></i>
                </button>
              </div>
              <p class="text-center text-purple-300 text-xs mt-3">
                SIGIL remembers your conversations to provide better help
              </p>
            </div>
          </div>
        </div>
      `;

      // Re-initialize icons
      lucide.createIcons();

      // Add event listeners
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      if (messageInput) {
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }

      if (sendBtn) {
        sendBtn.addEventListener('click', sendMessage);
      }
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      // Add user message
      messages.push({
        id: Date.now().toString(),
        role: 'user',
        content: text,
        timestamp: new Date()
      });

      input.value = '';
      render();

      // Simulate AI response
      setTimeout(() => {
        messages.push({
          id: (Date.now() + 1).toString(),
          role: 'assistant',
          content: "I understand. Let me help you with that. I remember that we've talked about similar topics before, and I can build on that understanding.",
          timestamp: new Date()
        });
        render();
      }, 1500);
    }

    // Initial render
    render();
  </script>
</body>
</html>
