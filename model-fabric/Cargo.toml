[package]
name = "model-fabric"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# HTTP (for cloud model integrations if needed)
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Configuration
toml = "0.8"
serde_yaml = "0.9"

# ML/LLM Frameworks - Candle v0.11.0 (upgraded from v0.3.3 to fix dependency conflicts)
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.15"
hf-hub = "0.3"

# Progress bars for downloads
indicatif = "0.17"

[dev-dependencies]
tempfile = { workspace = true }
